# Serves the static site over Tailscale.
#   docker compose up -d      -> http://<tailscale-ip>:8081
#   docker compose down       -> stop
# Override the bind address or port with TAILSCALE_IP / SITE_PORT (e.g. in a .env file).
services:
  site:
    image: nginx:alpine
    container_name: noahred16-site
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-100.108.225.5}:${SITE_PORT:-8081}:80"
    # Mount only what the page needs so .git, dotfiles, etc. are never served.
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./processing:/usr/share/nginx/html/processing:ro
      - ./italy:/usr/share/nginx/html/italy:ro
