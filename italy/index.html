<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRS — Italy Pics</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { height: 100%; }
  body { -webkit-font-smoothing: antialiased; overflow: hidden; }

  .app {
    height: 100dvh; display: flex; flex-direction: column;
    padding: var(--space-4) var(--space-4) 0; gap: var(--space-3);
    max-width: 1040px; margin: 0 auto;
  }

  .nav { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); flex: 0 0 auto; }
  .nav-brand { font-family: var(--font-heading); font-size: clamp(17px, 4.4vw, 22px); display: flex; align-items: center; gap: var(--space-2); }
  .brand-dot { width: 15px; height: 15px; border-radius: 999px; background: var(--color-accent); display: block; }
  .nav small { font-size: 12px; }

  .trips { display: flex; flex-wrap: nowrap; gap: 6px; flex: 0 0 auto;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .trips::-webkit-scrollbar { display: none; }
  .trip { flex: 0 0 auto; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0;
    padding: 7px var(--space-4); border-radius: 999px; white-space: nowrap; text-align: left;
    font-size: 14px; line-height: 1.25; }
  .trip .meta { font-family: var(--font-body); font-size: 10px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase; opacity: .72; }

  /* ---- map + tray share one box ---- */
  .board { position: relative; flex: 1 1 auto; min-height: 0; --tray: clamp(300px, 62%, 720px); }
  .stage-holder { position: absolute; inset: 0 0 calc(var(--tray) - 14px); display: grid; place-items: center; }
  .stage { position: relative; height: 100%; aspect-ratio: 700 / 830; max-width: 100%; container-type: size; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  .layer { position: absolute; inset: 0; z-index: 4; }

  .node { position: absolute; transform: translate(-50%, -50%);
    transition: opacity .35s ease, left .85s cubic-bezier(.4,0,.2,1), top .85s cubic-bezier(.4,0,.2,1); }
  .node.active { z-index: 3; }
  .node:hover { z-index: 4; }
  .node.off { display: none; }
  .node.dim { opacity: .4; }
  .dot {
    position: relative; display: block; padding: 0; overflow: hidden;
    width: clamp(26px, 7cqw, 52px); height: clamp(26px, 7cqw, 52px);
    border-radius: 999px; border: 3px solid var(--color-bg);
    background: var(--color-accent-200); cursor: pointer;
    box-shadow: 0 0 0 2px var(--color-accent-2-500), var(--shadow-sm);
    transition: box-shadow .3s ease, transform .3s ease;
  }
  .dot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .node:not(.dim):hover .dot { transform: scale(1.1); box-shadow: 0 0 0 3px var(--color-accent), var(--shadow-lg); }
  .node.active .dot { transform: scale(1.16);
    box-shadow: 0 0 0 3px var(--color-accent), 0 0 0 10px color-mix(in srgb, var(--color-accent) 18%, transparent), var(--shadow-md); }
  .node.dim .dot { cursor: default; box-shadow: 0 0 0 2px var(--color-neutral-500), var(--shadow-sm); }

  .label {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: 0; padding: 2px 4px; cursor: pointer;
    font-family: var(--font-heading); font-size: clamp(13px, 2.2cqw, 20px);
    top: calc(50% + var(--dy, 0px));
    color: var(--color-text); white-space: nowrap; transition: opacity .3s ease, color .2s ease;
  }
  .node:not(.dim):hover .label { color: var(--color-accent-700); text-decoration: underline;
    text-decoration-color: var(--color-accent-300); text-underline-offset: 5px; text-decoration-thickness: 2px; }
  .node.active .label { color: var(--color-accent-700); }
  .node.dim .label { cursor: default; }
  .board.home .node { pointer-events: none; }   /* home view: pins are not clickable */
  .side-right .label { left: calc(100% + 9px); }
  .side-left  .label { right: calc(100% + 9px); text-align: right; }
  @container (max-width: 430px) {
    .side-left .label { left: 50%; right: auto; text-align: center;
      top: calc(50% - 24px); transform: translate(-50%, -50%); }
    .side-left.flip .label { top: calc(50% + 24px); }
    .node.n-above .label, .node.n-below .label { left: 50%; right: auto; text-align: center;
      transform: translate(-50%, -50%); }
    .node.n-above .label { top: calc(50% - 24px); }
    .node.n-below .label { top: calc(50% + 24px); }
  }
  .node.force-left .label { left: auto; right: calc(100% + 9px); text-align: right;
    transform: translateY(-50%); top: calc(50% + var(--dy, 0px)); }
  .node.force-right .label { left: calc(100% + 9px); right: auto; text-align: left;
    transform: translateY(-50%); top: calc(50% + var(--dy, 0px)); }
  .node.force-center .label { left: 50%; right: auto; text-align: center;
    transform: translate(-50%, -50%); top: calc(50% + var(--dy, 0px)); }

  /* ---- floating photo tray ---- */
  .tray {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--tray); z-index: 20;
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--color-bg) 88%, transparent);
    backdrop-filter: blur(9px) saturate(120%);
    border-top: 1px solid var(--color-accent-2-200);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: var(--shadow-lg);
    padding: var(--space-3) 0 0;
  }
  .tray-head { display: flex; align-items: baseline; gap: var(--space-2);
    padding: 0 var(--space-4) var(--space-2); flex: 0 0 auto; }
  .tray-head h2 { margin: 0; font-size: clamp(17px, 4.6vw, 23px); line-height: 1.1; }
  .tray-head .count { font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--color-accent-700); }
  .tray-head .hint { margin-left: auto; font-size: 11px; color: var(--color-neutral-600); }

  .row { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; gap: var(--space-3);
    overflow-x: auto; overflow-y: hidden; padding: 0 50% var(--space-3);
    scroll-snap-type: x mandatory; overscroll-behavior-x: contain; container-type: size;
    scrollbar-width: thin; scrollbar-color: var(--color-accent-2-300) transparent; }
  .row::-webkit-scrollbar { height: 5px; }
  .row::-webkit-scrollbar-thumb { background: var(--color-accent-2-300); border-radius: 999px; }

  .polaroid {
    --ar: .75;
    flex: 0 0 auto; scroll-snap-align: center; scroll-snap-stop: always;
    /* Frame height: as tall as the row allows, but no wider than the screen (minus a peek of the neighbours).
       44px / 16px = the polaroid's vertical / horizontal padding, so the frame keeps the photo's own ratio. */
    --fh: min(100cqh - 44px, (min(100vw, 1040px) - 2 * var(--space-4) - 56px) / var(--ar));
    height: calc(var(--fh) + 44px);
    width: calc(var(--fh) * var(--ar) + 16px);
    background: var(--color-neutral-100); padding: 8px 8px 36px;
    border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; position: relative;
    transition: transform .3s cubic-bezier(.2,.9,.2,1), opacity .3s ease;
    transform: rotate(var(--tilt, 0deg)) scale(.9); opacity: .62;
  }
  .polaroid .frame { flex: 1 1 auto; min-height: 0; border-radius: 5px; overflow: hidden; background: var(--color-neutral-200); }
  .polaroid .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* index + caption flow as one run of text, wrapping to at most two lines */
  .polaroid figcaption { position: absolute; left: 9px; right: 9px; bottom: 6px; margin: 0;
    font-size: 9.5px; line-height: 1.3; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .polaroid .idx { font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--color-accent-700); }
  .polaroid .sep { padding: 0 4px; color: var(--color-neutral-500); }
  .polaroid .cap { font-weight: 600; color: var(--color-neutral-700); }
  .polaroid.here { transform: rotate(0deg) scale(1); opacity: 1; box-shadow: var(--shadow-md); }

  .row.is-empty { padding-inline: var(--space-4); justify-content: center; overflow: hidden; }
  .row .empty { margin: 0; text-align: center; font-size: 14px; color: var(--color-neutral-600); }

  .divider { flex: 0 0 auto; align-self: center;
    font-family: var(--font-heading); font-size: 13px; color: var(--color-accent-2-700);
    letter-spacing: .04em; padding: 0 2px; }

  /* last tile of a trip: sized like a photo, points back to the map and the other trips */
  .polaroid .end-panel { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-2); padding: var(--space-3); text-align: center; overflow: auto;
    background: var(--color-accent-2-100); }
  .end-panel h3 { margin: 0; font-size: clamp(18px, 5vw, 22px); }
  .end-panel p { margin: 0 0 var(--space-1); font-size: 13px; color: var(--color-neutral-700); }
  .end-panel .btn { max-width: 100%; font-size: 13px; }

  /* wide-and-short viewports: map left, photo column right */
  @media (min-aspect-ratio: 1/1) {
    .stage-holder { inset: 0; right: clamp(300px, 46%, 540px); }
    .tray { top: 0; bottom: 0; left: auto; height: auto; width: clamp(300px, 46%, 540px);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      border-top: 0; border-left: 1px solid var(--color-accent-2-200); }
    .row { flex-direction: column; align-items: center;
      overflow-x: hidden; overflow-y: auto; padding: 0 var(--space-4);
      scroll-snap-type: y mandatory; container-type: normal; }
    .polaroid { height: auto; width: 100%; padding-bottom: 48px;
      max-width: min(400px, calc((100dvh - 246px) * var(--ar) + 16px)); }
    .polaroid figcaption { font-size: 13px; bottom: 8px; }
    .polaroid .frame { flex: none; aspect-ratio: var(--ar); }
    .divider { writing-mode: horizontal-tb; rotate: 90deg; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="nav">
    <span class="nav-brand"><span class="brand-dot"></span>NRS</span>
    <small class="text-muted">Italy · 2023 – 2026 · <a href="../">← Back to site</a></small>
  </header>

  <div class="trips" id="trips"></div>

  <div class="board">
    <div class="stage-holder">
      <div class="stage" id="stage">
        <svg id="map" viewBox="0 0 700 900" aria-hidden="true">
          <g id="geo">
            <g id="neighbours"></g>
            <path id="italy"></path>
            <g id="routes"></g>
          </g>
        </svg>
        <div class="layer" id="nodes"></div>
      </div>
    </div>

    <section class="tray">
      <div class="tray-head">
        <h2 id="tray-title">Pick a trip</h2>
        <span class="count" id="tray-count"></span>
        <span class="hint" id="hint">Swipe →</span>
      </div>
      <div class="row" id="row"></div>
    </section>
  </div>
</div>

<script>
const CITIES = {
  milan:    { name: 'Milan',    ll: [9.1900, 45.4642], side: 'left',  dy: -4 },
  bologna:  { name: 'Bologna',  ll: [11.3426, 44.4949], side: 'right', dy: -24, narrow: 'above' },
  florence: { name: 'Florence', ll: [11.2558, 43.7696], side: 'right', dy: 28, narrow: 'below' },
  palermo:  { name: 'Palermo',  ll: [13.3615, 38.1157], side: 'right', dy: 6 },
  turin:    { name: 'Turin',    ll: [7.6869, 45.0703], side: 'left',  dy: 0, local: true },
  genoa:    { name: 'Genoa',    ll: [8.9463, 44.4056], side: 'left',  dy: 0, local: true },
  verona:   { name: 'Verona',   ll: [10.9916, 45.4384], side: 'left',  dy: 0, local: true },
  padua:    { name: 'Padua',    ll: [11.8768, 45.4064], side: 'right', dy: 0, local: true },
  vicenza:  { name: 'Vicenza',  ll: [11.5354, 45.5455], side: 'left',  dy: 0, local: true },
  sottomarina: { name: 'Sottomarina', ll: [12.2939, 45.2103], side: 'right', dy: 0, local: true, narrow: 'below' },
  livorno:  { name: 'Livorno',  ll: [10.3106, 43.5485], side: 'left',  dy: 0,  local: true, narrow: 'below' },
  parma:    { name: 'Parma',    ll: [10.3279, 44.8015], side: 'left',  dy: -6, local: true },
  reggio:   { name: 'Reggio Emilia', ll: [10.6297, 44.6989], side: 'right', dy: -8, local: true },
  trapani:  { name: 'Trapani',  ll: [12.5365, 38.0176], side: 'left',  dy: 4, local: true },
  sanvito:  { name: 'San Vito Lo Capo', ll: [12.7362, 38.1747], side: 'left', dy: -22, local: true },
  castellammare: { name: 'Castellammare del Golfo', ll: [12.8807, 38.0261], side: 'right', dy: 26, local: true }
};
const DEFAULT_TRIP = null;   // trip id to open on load; null = the full map with every trip
// newest first: this is also the order of the trip buttons
const TRIPS = [
  { id: 't4', slug: 'sicilian-summer', label: 'Sicilian Summer', meta: 'Aug 2026',
    cities: ['palermo', 'trapani', 'castellammare', 'sanvito', 'palermo'] },
  { id: 't3', slug: 'central-italy',   label: 'Central Italy',   meta: 'Nov 2025',
    cities: ['florence', 'livorno', 'parma', 'reggio', 'bologna', 'florence'] },
  { id: 't2', slug: 'north-central-italy', label: 'North-central Italy', meta: 'Aug 2024',
    cities: ['bologna', 'sottomarina', 'padua', 'vicenza', 'verona', 'bologna'] },
  { id: 't1', slug: 'northern-italy',  label: 'Northern Italy',  meta: 'Nov 2023',
    cities: ['milan', 'turin', 'genoa', 'milan'] }
];
// cities shown in the all-trips overview: every stop except the small local ones
const ROUTE_ALL = [...new Set(TRIPS.flatMap(t => t.cities))].filter(c => !CITIES[c].local);

/* ---------- photos, in trip order (files live in ./photos) ---------- */
const PHOTO_DIR = 'photos/';
const PHOTO_AR = 3 / 4;   // width / height; override per photo with `ar` (corrected on load if wrong)
const PHOTOS = {
  t1: [],   // Northern Italy: photos to come
  t2: [],   // North-central Italy: photos to come
  t3: [
    { city: 'florence', file: 'florence_1840.jpeg',  cap: 'The Florence Duomo!' },
    { city: 'florence', file: 'florence_1841.jpeg',  cap: 'mmmmm.' },
    { city: 'florence', file: 'florence_1866.jpeg',  cap: 'The Ponte Vecchio bridge!' },
    { city: 'florence', file: 'florence_1920.jpeg',  cap: 'ACF Fiorentina, hbd to my love.', ar: 4 / 3 },
    { city: 'florence', file: 'florence_1930.jpeg',  cap: 'Florence gardBoboli Gardens.' },
    { city: 'livorno',  file: 'livorno_1961.jpeg',   cap: 'A lil pizazz.' },
    { city: 'livorno',  file: 'livorno_1972.jpeg',   cap: 'Livorno sea food.' },
    { city: 'livorno',  file: 'livorno_1976.jpeg',   cap: 'Cute little town.' },
    { city: 'parma',    file: 'parma_1986.jpeg',     cap: 'Traveling light lol.' },
    { city: 'parma',    file: 'parma_2003.jpeg',     cap: 'I got a new watch!' },
    { city: 'parma',    file: 'parma_2015.jpeg',     cap: 'Mittens bc it twas chilly.' },
    { city: 'reggio',   file: 'reggio_2035.jpeg',    cap: 'Love Italian breakfast. Drip Coffee Lab.' },
    { city: 'reggio',   file: 'reggio_2038.jpeg',    cap: 'Hotel view in Reggio Emilia.' },
    { city: 'bologna',  file: 'bologna_2069.jpeg',   cap: 'Lol the buffet fr had candy.', ar: 4 / 3 },
    { city: 'bologna',  file: 'bologna_2076.jpeg',   cap: 'Here I am.' },
    { city: 'bologna',  file: 'bologna_2079.jpeg',   cap: 'The cutest.' },
    { city: 'florence', file: 'florence_2112.jpeg',  cap: 'Back in Florence.' },
    { city: 'florence', file: 'florence_2114.jpeg',  cap: 'Realized I hadnt had enough gelato.' },
    { city: 'florence', file: 'florence_2127.jpeg',  cap: 'Love a good book store.' },
    { city: 'florence', file: 'florence_9916.jpeg',  cap: 'Fin. Te amo!', ar: 4 / 3 }
  ],
  t4: [
    { city: 'palermo',       file: 'palermo_5065.jpeg',       cap: 'Our ride.' },
    { city: 'trapani',       file: 'trapani_3843.jpeg',       cap: 'Trapani feat fike shirt :)' },
    { city: 'trapani',       file: 'trapani_3853.jpeg',       cap: 'Sunset outside our apartment.' },
    { city: 'trapani',       file: 'trapani_3894.jpeg',       cap: 'Favignana blue water feat Kenita <3' },
    { city: 'trapani',       file: 'trapani_3952.jpeg',       cap: 'Even smaller island seen from Favignana.' },
    { city: 'trapani',       file: 'trapani_4005.jpeg',       cap: 'Scooters > electric bikes.' },
    { city: 'trapani',       file: 'trapani_4140.jpeg',       cap: 'Kenia loves taking photos.' },
    { city: 'trapani',       file: 'trapani_4749.jpeg',       cap: 'Nice hand placement. Erice town.' },
    { city: 'castellammare', file: 'castellammare_5094.jpeg', cap: 'She loved this view.' },
    { city: 'castellammare', file: 'castellammare_5280.jpeg', cap: 'Reverse view from top of the mountain.', ar: 4 / 3 },
    { city: 'sanvito',       file: 'san-vito_5026.jpeg',      cap: 'The San Vito Lo Capo.' },
    { city: 'sanvito',       file: 'san-vito_5029.jpeg',      cap: 'Zingaro Nature Reserve, awesome hike :)' },
    { city: 'sanvito',       file: 'san-vito_5290.jpeg',      cap: 'First cove from Zingaro.' },
    { city: 'sanvito',       file: 'san-vito_5372.jpeg',      cap: 'Second cove from Zingaro.' },
    { city: 'palermo',       file: 'palermo_7261.jpeg',       cap: '3pm forbidden ciesta lunch.' },
    { city: 'palermo',       file: 'palermo_7296.jpeg',       cap: 'Sicily had the best pizza of Italy IMO.' },
    { city: 'palermo',       file: 'palermo_7338.jpeg',       cap: 'View of old mafia mansions on mnt from boat tour.' },
    { city: 'palermo',       file: 'palermo_7396.jpeg',       cap: "Can't believe we didn't get any aranchini pics." },
    { city: 'palermo',       file: 'palermo_7999.jpeg',       cap: 'Fin :)' }
  ]
};
// a city's map pin shows the first photo taken there
const COVERS = {};
Object.values(PHOTOS).flat().forEach(p => { if (!COVERS[p.city]) COVERS[p.city] = p.file; });

const W = 700, H = 900;
let selected = null, active = null, pts = {}, K = 1, TX = 0, TY = 0;

const stage = document.getElementById('stage');
const row = document.getElementById('row');
const tripsEl = document.getElementById('trips');

/* ---------- trip buttons ---------- */
TRIPS.forEach(t => {
  const b = document.createElement('button');
  b.className = 'btn btn-secondary trip';
  b.dataset.trip = t.id;
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span class="meta"></span>' + t.label;
  b.querySelector('.meta').textContent = t.meta;
  // clicking the active trip returns to the all-trips overview, but only when there are several trips
  b.addEventListener('click', () => go(selected === t.id && TRIPS.length > 1 ? null : t.id));
  tripsEl.appendChild(b);
});

/* ---------- URL: italy/#sicilian-summer opens that trip; no hash = the full map ---------- */
const tripFromUrl = () => {
  const t = TRIPS.find(x => x.slug === location.hash.slice(1));
  return t ? t.id : DEFAULT_TRIP;
};

// select a trip and record it in the URL (a new history entry, so Back returns to the previous view)
function go(id) {
  const t = TRIPS.find(x => x.id === id);
  const hash = t ? '#' + t.slug : '';
  if (location.hash !== hash) {
    try { history.pushState(null, '', location.pathname + location.search + hash); } catch (e) { /* keep working without a URL */ }
  }
  selectTrip(id);
}

// Back / Forward, or someone editing the #hash by hand
window.addEventListener('popstate', () => selectTrip(tripFromUrl()));

function cityList() {
  if (!selected) return ROUTE_ALL;
  const cs = TRIPS.find(t => t.id === selected).cities;
  return cs.filter((c, i) => cs.indexOf(c) === i);
}

function selectTrip(id) {
  selected = id;
  tripsEl.querySelectorAll('.trip').forEach(b => {
    const on = b.dataset.trip === id;
    b.className = 'btn trip ' + (on ? 'btn-primary' : 'btn-secondary');
    b.setAttribute('aria-pressed', String(on));
    if (on) {
      const r = b.getBoundingClientRect(), tr = tripsEl.getBoundingClientRect();
      tripsEl.scrollTo({ left: tripsEl.scrollLeft + (r.left + r.width / 2) - (tr.left + tr.width / 2),
        behavior: reduceMotion.matches ? 'auto' : 'smooth' });
    }
  });
  const list = cityList();
  document.querySelectorAll('.node').forEach(n => {
    const inTrip = list.includes(n.dataset.city);
    n.classList.toggle('dim', !inTrip);
    n.dataset.hide = String(!!CITIES[n.dataset.city].local && !inTrip);
    // on the home view (no trip) the pins are for orientation only; a trip has to be chosen first
    n.querySelector('.dot').disabled = !id || !inTrip;
    n.querySelector('.label').disabled = !id || !inTrip;
  });
  document.querySelector('.board').classList.toggle('home', !id);
  document.querySelectorAll('#routes path').forEach(p => {
    const on = !id || p.dataset.trip === id;
    p.setAttribute('stroke', on ? (id ? 'var(--color-accent)' : 'var(--color-accent-2-500)') : 'var(--color-neutral-400)');
    p.setAttribute('opacity', on ? (id ? 1 : 0.7) : 0.28);
  });
  const t = TRIPS.find(x => x.id === id);
  document.getElementById('tray-title').textContent = t ? t.label : 'Pick a trip';
  setView(...viewForTrip(id));
  buildRow();
}

/* ---------- map ---------- */
function sx(k) { return pts[k].x * K + TX; }
function sy(k) { return pts[k].y * K + TY; }

function setView(k, tx, ty) {
  K = k; TX = tx; TY = ty;
  document.getElementById('geo').setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + k + ')');
  const nodes = [...document.querySelectorAll('.node')];
  nodes.forEach(n => {
    const key = n.dataset.city;
    const py = sy(key) / H * 100;
    n.classList.toggle('flip', py < 11);
    n.classList.toggle('off', n.dataset.hide === 'true' ||
      sx(key) / W * 100 < -2 || sx(key) / W * 100 > 102 || py < -1 || py > 101);
  });

  // cartographic displacement: nudge overlapping pins apart in screen space
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const dw = 26 + 6;
  const P = nodes.filter(n => !n.classList.contains('off')).map(n => ({
    n, x: sx(n.dataset.city) / W * sw, y: sy(n.dataset.city) / H * sh
  }));
  for (let pass = 0; pass < 14; pass++) {
    let moved = false;
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy) || 0.01;
      if (d < dw) {
        const push = (dw - d) / 2;
        dx /= d; dy /= d;
        a.x -= dx * push; a.y -= dy * push;
        b.x += dx * push; b.y += dy * push;
        moved = true;
      }
    }
    if (!moved) break;
  }
  P.forEach(p => {
    p.n.style.left = (p.x / sw * 100) + '%';
    p.n.style.top = (p.y / sh * 100) + '%';
  });

  clearTimeout(labelTimer);
  labelTimer = setTimeout(layoutLabels, 900);
}

let labelTimer = 0;
function layoutLabels() {
  const sb = stage.getBoundingClientRect();
  const nodes = [...document.querySelectorAll('.node:not(.off)')];
  if (!nodes.length) return;
  nodes.forEach(n => {
    n.classList.remove('force-left', 'force-right', 'force-center');
    n.querySelector('.label').style.setProperty('--dy', (CITIES[n.dataset.city].dy || 0) + 'px');
  });
  // keep every label inside the frame
  nodes.forEach(n => {
    const l = n.querySelector('.label');
    let r = l.getBoundingClientRect();
    if (r.right > sb.right - 3) n.classList.add('force-left');
    else if (r.left < sb.left + 3) n.classList.add('force-right');
    r = l.getBoundingClientRect();
    if (r.left < sb.left + 3 || r.right > sb.right - 3) {
      n.classList.remove('force-left', 'force-right');
      n.classList.add('force-center');
    }
  });
  // push overlapping labels apart vertically, and clear of other pins
  const dots = nodes.map(n => n.querySelector('.dot'));
  for (let pass = 0; pass < 6; pass++) {
    const items = nodes.map(n => {
      const l = n.querySelector('.label');
      return { n, l, r: l.getBoundingClientRect() };
    }).sort((a, b) => a.r.top - b.r.top);
    let moved = false;
    const bump = (o, dy) => {
      const cur = parseFloat(o.l.style.getPropertyValue('--dy')) || 0;
      o.l.style.setProperty('--dy', (cur + dy) + 'px');
      o.r = o.l.getBoundingClientRect();
      moved = true;
    };
    for (let i = 1; i < items.length; i++) {
      const a = items[i - 1], b = items[i];
      const ox = Math.min(a.r.right, b.r.right) - Math.max(a.r.left, b.r.left);
      const oy = a.r.bottom - b.r.top;
      if (ox > -3 && oy > -2) bump(b, oy + 4);
    }
    items.forEach(o => {
      dots.forEach(d => {
        if (d === o.n.querySelector('.dot')) return;
        const dr = d.getBoundingClientRect();
        const ox = Math.min(o.r.right, dr.right) - Math.max(o.r.left, dr.left);
        const oy = Math.min(o.r.bottom, dr.bottom) - Math.max(o.r.top, dr.top);
        if (ox > 1 && oy > 1) {
          const below = (o.r.top + o.r.bottom) / 2 >= (dr.top + dr.bottom) / 2;
          bump(o, below ? oy + 3 : -(oy + 3));
        }
      });
    });
    if (!moved) break;
  }
  // clamp back inside top/bottom
  nodes.forEach(n => {
    const l = n.querySelector('.label'), r = l.getBoundingClientRect();
    const cur = parseFloat(l.style.getPropertyValue('--dy')) || 0;
    if (r.bottom > sb.bottom - 3) l.style.setProperty('--dy', (cur - (r.bottom - sb.bottom + 3)) + 'px');
    else if (r.top < sb.top + 3) l.style.setProperty('--dy', (cur + (sb.top + 3 - r.top)) + 'px');
  });
}

function viewForTrip(id) {
  if (!id) return [1, 0, 0];
  const cs = cityList();
  const xs = cs.map(c => pts[c].x), ys = cs.map(c => pts[c].y);
  const spanX = Math.max(...xs) - Math.min(...xs), spanY = Math.max(...ys) - Math.min(...ys);
  const pad = Math.max(10, Math.max(spanX, spanY) * 0.3);
  const k = Math.max(1, Math.min(W / (spanX + pad * 2), H / (spanY + pad * 2), 16));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
  const cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  return [k, W / 2 - cx * k, H / 2 - cy * k];
}

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(topo => {
  const all = topojson.feature(topo, topo.objects.countries).features;
  const italy = all.find(f => f.properties && f.properties.name === 'Italy') || all.find(f => f.id === '380');
  const proj = d3.geoMercator().fitExtent([[-26, -30], [726, 910]], italy);
  const path = d3.geoPath(proj);

  d3.select('#neighbours').selectAll('path')
    .data(all.filter(f => f !== italy)).join('path')
      .attr('d', path)
      .attr('fill', 'var(--color-neutral-200)')
      .attr('stroke', 'var(--color-bg)')
      .attr('stroke-width', 1.5)
      .attr('vector-effect', 'non-scaling-stroke');

  d3.select('#italy')
    .attr('d', path(italy))
    .attr('fill', 'var(--color-accent-2-300)')
    .attr('stroke', 'var(--color-accent-2-600)')
    .attr('stroke-width', 1.5)
    .attr('stroke-linejoin', 'round')
    .attr('vector-effect', 'non-scaling-stroke');

  Object.entries(CITIES).forEach(([k, c]) => { const p = proj(c.ll); pts[k] = { x: p[0], y: p[1] }; });

  drawRoutes();
  drawNodes();
  document.getElementById('geo').style.transition = 'transform .85s cubic-bezier(.4,0,.2,1)';
  selectTrip(tripFromUrl());
});

function drawRoutes() {
  const g = document.getElementById('routes');
  TRIPS.forEach(t => {
    let d = '';
    for (let i = 0; i < t.cities.length - 1; i++) {
      const a = pts[t.cities[i]], b = pts[t.cities[i + 1]];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const nx = -(b.y - a.y), ny = (b.x - a.x);
      const len = Math.hypot(nx, ny) || 1;
      const bow = Math.hypot(b.x - a.x, b.y - a.y) * 0.16;
      d += `M${a.x} ${a.y} Q${mx + nx / len * bow} ${my + ny / len * bow} ${b.x} ${b.y} `;
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', 3.5);
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-dasharray', '0.1 13');
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    p.dataset.trip = t.id;
    p.style.transition = 'stroke .35s ease, opacity .35s ease';
    g.appendChild(p);
  });
}

function drawNodes() {
  const host = document.getElementById('nodes');
  const inTrips = new Set(TRIPS.flatMap(t => t.cities));   // skip cities no enabled trip visits
  Object.entries(CITIES).filter(([k]) => inTrips.has(k)).forEach(([k, c]) => {
    const n = document.createElement('div');
    n.className = 'node side-' + c.side + (c.narrow ? ' n-' + c.narrow : '');
    n.dataset.city = k;
    const b = document.createElement('button');
    b.className = 'dot';
    b.setAttribute('aria-label', 'Jump to photos from ' + c.name);
    if (COVERS[k]) {
      const cover = document.createElement('img');
      cover.src = PHOTO_DIR + COVERS[k];
      cover.alt = '';
      cover.decoding = 'async';
      b.appendChild(cover);
    }
    const l = document.createElement('button');
    l.className = 'label';
    l.style.setProperty('--dy', (c.dy || 0) + 'px');    l.textContent = c.name;
    const go = () => { if (cityList().includes(k)) scrollToCity(k); };
    b.addEventListener('click', go);
    l.addEventListener('click', go);
    n.append(b, l);
    host.appendChild(n);
  });
}

/* ---------- end-of-trip tile ---------- */
function endTile() {
  const trip = TRIPS.find(t => t.id === selected);
  const fig = document.createElement('figure');
  fig.className = 'polaroid end';
  fig.style.setProperty('--tilt', '0deg');
  const panel = document.createElement('div');
  panel.className = 'frame end-panel';
  const title = document.createElement('h3');
  title.textContent = 'That\u2019s ' + trip.label + '!';
  const msg = document.createElement('p');
  msg.textContent = 'There\u2019s more of Italy to explore.';
  const back = document.createElement('button');
  back.className = 'btn btn-primary';
  back.textContent = '\u2190 Back to the map';
  back.addEventListener('click', () => go(null));
  panel.append(back);
  TRIPS.filter(t => t.id !== selected).forEach(t => {
    const b = document.createElement('button');
    b.className = 'btn btn-secondary';
    b.textContent = t.label + ' \u00b7 ' + t.meta;
    b.addEventListener('click', () => go(t.id));
    panel.appendChild(b);
  });
  const cap = document.createElement('figcaption');
  const idx = document.createElement('span');
  idx.className = 'idx';
  idx.textContent = 'The end';
  cap.appendChild(idx);
  fig.append(panel, cap);
  return fig;
}

/* ---------- photo tray ---------- */
function buildRow() {
  const photos = selected ? (PHOTOS[selected] || []) : [];   // the home view has no slideshow
  row.innerHTML = '';
  const perCity = {};
  photos.forEach((ph, i) => {
    const c = CITIES[ph.city];
    if (i > 0 && photos[i - 1].city !== ph.city) {
      const d = document.createElement('span');
      d.className = 'divider';
      d.textContent = '→';
      row.appendChild(d);
    }
    const n = perCity[ph.city] = (perCity[ph.city] || 0) + 1;
    const fig = document.createElement('figure');
    fig.className = 'polaroid';
    fig.dataset.city = ph.city;
    fig.style.setProperty('--tilt', (i % 2 ? 1.4 : -1.4) + 'deg');
    const ar = ph.ar || PHOTO_AR;
    fig.style.setProperty('--ar', ar);
    const frame = document.createElement('div');
    frame.className = 'frame';
    const img = document.createElement('img');
    img.src = PHOTO_DIR + ph.file;
    img.alt = ph.cap;
    img.decoding = 'async';
    if (i > 1) img.loading = 'lazy';
    img.addEventListener('load', () => {
      const r = img.naturalWidth / img.naturalHeight;
      if (Math.abs(r / ar - 1) > 0.01) fig.style.setProperty('--ar', r);
    });
    frame.appendChild(img);
    const cap = document.createElement('figcaption');
    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = c.name.split(' ')[0] + ' ' + String(n).padStart(2, '0');
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '\u00b7';
    const txt = document.createElement('span');
    txt.className = 'cap';
    txt.textContent = ph.cap;
    cap.append(idx, sep, txt);
    fig.append(frame, cap);
    row.appendChild(fig);
  });
  if (selected && photos.length) row.appendChild(endTile());
  document.getElementById('tray-count').textContent = photos.length ? photos.length + ' photos' : '';
  row.classList.toggle('is-empty', !photos.length);
  if (!photos.length) {
    const msg = document.createElement('p');
    msg.className = 'empty';
    msg.textContent = selected ? 'Photos from this trip are coming soon.'
      : 'Pick a trip above to explore the map and flip through the photos.';
    row.appendChild(msg);
    document.getElementById('hint').textContent = '';
    document.querySelectorAll('.node.active').forEach(n => n.classList.remove('active'));
  }
  active = null;
  here = null;
  const start = () => { padRow(); centerCard(row.querySelector('.polaroid'), false); syncActive(); };
  start();
  requestAnimationFrame(start);
}

function setActive(key) {
  if (key === active) return;
  active = key;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('active', n.dataset.city === key));
}

function padRow() {
  const card = row.querySelector('.polaroid');
  if (isVert() && !card) {
    row.style.paddingBlock = '';
  } else if (isVert()) {
    const h = card.getBoundingClientRect().height;
    row.style.paddingBlock = Math.max(8, (row.clientHeight - h) / 2) + 'px';
    row.style.paddingInline = '';
  } else {
    row.style.paddingBlock = '';
    row.style.paddingInline = '';
  }
}

let here = null;
function syncActive() {
  const cards = [...row.querySelectorAll('.polaroid')];
  if (!cards.length) return;
  const v = isVert();
  const rr = row.getBoundingClientRect();
  const mid = v ? rr.top + row.clientHeight / 2 : rr.left + row.clientWidth / 2;
  let best = cards[0], bestD = Infinity;
  cards.forEach(card => {
    const r = card.getBoundingClientRect();
    const d = Math.abs((v ? r.top + r.height / 2 : r.left + r.width / 2) - mid);
    if (d < bestD) { bestD = d; best = card; }
  });
  if (best !== here) {
    if (here) here.classList.remove('here');
    best.classList.add('here');
    here = best;
  }
  setActive(best.dataset.city);
  document.getElementById('hint').textContent = v ? 'Scroll \u2193' : 'Swipe \u2192';
}

let ticking = false;
row.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; syncActive(); });
}, { passive: true });
window.addEventListener('resize', () => { padRow(); layoutLabels(); syncActive(); });

function isVert() { return getComputedStyle(row).flexDirection === 'column'; }

// native smooth scrolling cooperates with scroll-snap (a hand-rolled animation fights it)
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function centerCard(card, smooth = true) {
  if (!card) return;
  const r = card.getBoundingClientRect(), rr = row.getBoundingClientRect();
  const behavior = smooth && !reduceMotion.matches ? 'smooth' : 'auto';
  if (isVert()) row.scrollTo({ top: row.scrollTop + (r.top + r.height / 2) - (rr.top + rr.height / 2), behavior });
  else row.scrollTo({ left: row.scrollLeft + (r.left + r.width / 2) - (rr.left + rr.width / 2), behavior });
}

function scrollToCity(key) {
  centerCard(row.querySelector('.polaroid[data-city="' + key + '"]'));
}

row.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  const card = e.target.closest('.polaroid');
  if (card && !card.classList.contains('here')) centerCard(card);
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.isContentEditable) return;
  const fwd = e.key === 'ArrowRight' || e.key === 'ArrowDown';
  const back = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
  if (!fwd && !back) return;
  const cards = [...row.querySelectorAll('.polaroid')];
  const i = cards.findIndex(c => c.classList.contains('here'));
  const next = cards[Math.min(cards.length - 1, Math.max(0, i + (fwd ? 1 : -1)))];
  if (next) centerCard(next);
});
